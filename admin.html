<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Padre</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; }
        h1 { color: #5a3e7a; text-align: center; margin-bottom: 30px; }
        
        /* Estilos dos Cards */
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .sigiloso { border-left: 4px solid #d9534f; background: #fff5f5; }
        .publico { border-left: 4px solid #8a2be2; background: #fafafa; }
        .nome { font-weight: bold; color: #5a3e7a; margin-bottom: 5px; font-size: 1.05em; }
        .pedido { font-size: 1em; margin: 10px 0; line-height: 1.4; }
        .info { font-size: 0.8em; color: #888; display: flex; justify-content: space-between; border-top: 1px solid #eee; padding-top: 8px; margin-top: 8px; }
        
        /* Títulos das Seções */
        .titulo-secao { font-size: 1.1em; color: #5a3e7a; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-top: 30px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        /* Tela de Login */
        #login-screen { text-align: center; margin-top: 50px; display: block; }
        #conteudo-screen { display: none; }
        input { padding: 12px; width: 80%; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 15px; font-size: 1em; }
        button { padding: 12px 25px; background: #5a3e7a; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; font-weight: bold; }
        .loading { text-align: center; color: #777; padding: 20px; }
        .erro { color: #d9534f; text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <h1>Área Restrita</h1>
        <p>Digite a senha para ver as intenções.</p>
        <input type="password" id="senha" placeholder="Senha de acesso">
        <br>
        <button onclick="fazerLogin()">Entrar</button>
        <p id="msg-login" class="erro"></p>
    </div>

    <!-- TELA DE CONTEÚDO -->
    <div id="conteudo-screen">
        <h1>Intenções Recebidas</h1>
        <div id="lista-intencoes" class="loading">Carregando...</div>
    </div>

    <script>
        // ⚠️ COLOQUE O LINK DO SEU WORKER AQUI
        const URL_API = 'https://api-paroquia.paroquiasjoaoboscons.workers.dev';
        let senhaSalva = '';

        // Função de Login
        async function fazerLogin() {
            const senhaInput = document.getElementById('senha').value;
            const msg = document.getElementById('msg-login');
            
            if (!senhaInput) { msg.innerText = "Digite a senha."; return; }
            
            try {
                const auth = btoa('padre:' + senhaInput);
                
                const resposta = await fetch(`${URL_API}/admin/intencoes`, {
                    headers: { 'Authorization': 'Basic ' + auth }
                });

                if (resposta.status === 401) throw new Error("Senha incorreta");
                if (!resposta.ok) throw new Error("Erro no servidor");

                const dados = await resposta.json();
                
                senhaSalva = senhaInput;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('conteudo-screen').style.display = 'block';
                
                renderizarLista(dados);

            } catch (erro) {
                msg.innerText = erro.message;
            }
        }

        // Função que desenha os cards separados
        function renderizarLista(dados) {
            const container = document.getElementById('lista-intencoes');
            
            if (dados.length === 0) {
                container.innerHTML = '<p style="text-align:center;">Nenhuma intenção cadastrada.</p>';
                return;
            }

            // 1. Separar os dados
            const sigilosas = dados.filter(item => item.visibilidade === 'privada');
            const publicas = dados.filter(item => item.visibilidade !== 'privada');

            let html = '';

            // 2. Desenhar Sigilosas (se houver)
            if (sigilosas.length > 0) {
                html += `<div class="titulo-secao">🔒 Intenções Sigilosas (${sigilosas.length})</div>`;
                sigilosas.forEach(item => {
                    html += criarCard(item);
                });
            }

            // 3. Desenhar Públicas (se houver)
            if (publicas.length > 0) {
                html += `<div class="titulo-secao">🌐 Intenções Públicas (${publicas.length})</div>`;
                publicas.forEach(item => {
                    html += criarCard(item);
                });
            }

            container.innerHTML = html;
        }

        // Função auxiliar para criar o HTML de um card
        function criarCard(item) {
            const classe = item.visibilidade === 'privada' ? 'card sigiloso' : 'card publico';
            const dataFormatada = new Date(item.criado_em).toLocaleDateString('pt-BR');
            
            return `
                <div class="${classe}">
                    <div class="nome">${item.nome || 'Anônimo'}</div>
                    <div class="pedido">${item.pedido}</div>
                    <div class="info">
                        <span>Enviado em: ${dataFormatada}</span>
                        <span>Rezadas: ${item.rezadas}</span>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
