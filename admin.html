<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Padre</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; }
        h1 { color: #5a3e7a; text-align: center; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .sigiloso { border-left: 4px solid #d9534f; background: #fff5f5; }
        .publico { border-left: 4px solid #8a2be2; }
        .nome { font-weight: bold; color: #5a3e7a; margin-bottom: 5px; }
        .pedido { font-size: 1em; margin: 10px 0; }
        .info { font-size: 0.8em; color: #888; display: flex; justify-content: space-between; }
        .loading { text-align: center; color: #777; }
        .erro { color: #d9534f; text-align: center; font-weight: bold; }
        
        /* Tela de Login */
        #login-screen { text-align: center; margin-top: 50px; display: block; }
        #conteudo-screen { display: none; }
        input { padding: 10px; width: 80%; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #5a3e7a; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN (Aparece primeiro) -->
    <div id="login-screen">
        <h1>Área Restrita</h1>
        <p>Digite a senha para ver as intenções.</p>
        <input type="password" id="senha" placeholder="Senha">
        <br>
        <button onclick="fazerLogin()">Entrar</button>
        <p id="msg-login" style="color: red; margin-top: 10px;"></p>
    </div>

    <!-- TELA DE CONTEÚDO (Aparece após o login) -->
    <div id="conteudo-screen">
        <h1>Intenções</h1>
        <div id="lista-intencoes" class="loading">Carregando...</div>
    </div>

    <script>
        // ⚠️ COLOQUE O LINK DO SEU WORKER AQUI
        const URL_API = 'https://api-paroquia.paroquiasjoaoboscons.workers.dev';
        let senhaSalva = '';

        // Função de Login
        async function fazerLogin() {
            const senhaInput = document.getElementById('senha').value;
            const msg = document.getElementById('msg-login');
            
            if (!senhaInput) { msg.innerText = "Digite a senha."; return; }
            
            // Tenta buscar os dados com a senha digitada
            try {
                // Transforma "padre:senha" em Base64 (padrão do Basic Auth)
                const auth = btoa('padre:' + senhaInput);
                
                const resposta = await fetch(`${URL_API}/admin/intencoes`, {
                    headers: { 'Authorization': 'Basic ' + auth }
                });

                if (resposta.status === 401) {
                    throw new Error("Senha incorreta");
                }

                if (!resposta.ok) {
                    throw new Error("Erro no servidor");
                }

                const dados = await resposta.json();
                
                // Se deu certo, guarda a senha e mostra a tela
                senhaSalva = senhaInput;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('conteudo-screen').style.display = 'block';
                
                renderizarLista(dados);

            } catch (erro) {
                msg.innerText = erro.message;
            }
        }

        // Função que desenha os cards na tela
        function renderizarLista(dados) {
            const container = document.getElementById('lista-intencoes');
            
            if (dados.length === 0) {
                container.innerHTML = '<p style="text-align:center;">Nenhuma intenção cadastrada.</p>';
                return;
            }

            let html = '';
            dados.forEach(item => {
                // Define a cor baseada no sigilo
                const classe = item.visibilidade === 'privada' ? 'card sigiloso' : 'card publico';
                const badge = item.visibilidade === 'privada' ? '🔒 Sigilosa' : '🌐 Pública';
                const dataFormatada = new Date(item.criado_em).toLocaleDateString('pt-BR');

                html += `
                    <div class="${classe}">
                        <div class="nome">${item.nome || 'Anônimo'} - <span style="font-weight:normal; font-size:0.8em;">${badge}</span></div>
                        <div class="pedido">${item.pedido}</div>
                        <div class="info">
                            <span>Enviado em: ${dataFormatada}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
