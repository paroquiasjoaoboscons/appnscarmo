<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Secretaria</title>
    <style>
        :root { --cor-primaria: #5a3e7a; --cor-secundaria: #8a2be2; --cor-fundo: #f4f4f9; --cor-branca: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: var(--cor-fundo); padding-bottom: 20px; }
        
        header { background: var(--cor-primaria); color: white; padding: 15px; text-align: center; }
        
        /* Login */
        #login-screen { text-align: center; margin-top: 50px; display: block; padding: 0 20px; }
        input { padding: 12px; width: 100%; max-width: 300px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; font-size: 1em; }
        button { padding: 12px 25px; background: var(--cor-primaria); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: bold; width: 100%; max-width: 300px; }
        .erro { color: #d9534f; text-align: center; font-weight: bold; margin-top: 15px; font-size: 0.9em; }

        /* Conteúdo */
        #conteudo-screen { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
        .abas-container { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; overflow-x: auto; }
        .aba-btn { flex: 1; padding: 10px; background: none; border: none; font-weight: bold; color: #888; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
        .aba-btn.ativa { color: var(--cor-primaria); border-bottom-color: var(--cor-primaria); }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; }
        .card.ativa { display: block; }
        
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9em; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-salvar { margin-top: 15px; background: var(--cor-secundaria); }
        
        .msg { padding: 10px; margin-top: 15px; border-radius: 5px; display: none; text-align: center; font-weight: bold; }
        .msg.sucesso { background: #d4edda; color: #155724; }
        .msg.erro { background: #f8d7da; color: #721c24; }
        
        .btn-sair { background: none; border: 1px solid #d9534f; color: #d9534f; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 0.85em; font-weight: bold; width: auto; margin-bottom: 15px; }

        /* Aba Pascom */
        .upload-area { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; text-align: center; margin-bottom: 15px; }
        .upload-area input[type="file"] { margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Painel da Secretaria</h1>
        <p>Paróquia São João Bosco</p>
    </header>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <h2>Acesso Restrito</h2>
        <p style="margin-bottom: 15px;">Digite a senha para acessar.</p>
        <input type="password" id="senha" placeholder="Senha da Secretaria">
        <br>
        <button onclick="fazerLogin()">Entrar</button>
        <p id="msg-login" class="erro"></p>
    </div>

    <!-- TELA DE CONTEÚDO -->
    <div id="conteudo-screen">
        <button class="btn-sair" onclick="fazerLogout()">Sair</button>

        <div class="abas-container">
            <button class="aba-btn ativa" onclick="mudarAba('avisos', this)">Avisos</button>
            <button class="aba-btn" onclick="mudarAba('horarios', this)">Horários</button>
            <button class="aba-btn" onclick="mudarAba('aniversarios', this)">Aniversariantes</button>
            <button class="aba-btn" onclick="mudarAba('pascom', this)">Pascom</button>
        </div>

        <!-- FORM: AVISOS -->
        <div id="aba-avisos" class="card ativa">
            <h2>Cadastrar Aviso</h2>
            <div id="msg-aviso" class="msg"></div>
            <form id="form-aviso">
                <label>Título</label>
                <input type="text" id="aviso-titulo" required>
                <label>Data/Subtítulo</label>
                <input type="text" id="aviso-data" required>
                <label>Texto do Aviso</label>
                <input type="text" id="aviso-texto" required style="height: 80px;">
                <button type="submit" class="btn-salvar">Salvar Aviso</button>
            </form>
        </div>

        <!-- FORM: HORÁRIOS -->
        <div id="aba-horarios" class="card">
            <h2>Cadastrar Horário</h2>
            <div id="msg-horario" class="msg"></div>
            <form id="form-horario">
                <label>Tipo (Missa / Confissão)</label>
                <input type="text" id="horario-tipo" required>
                <label>Dia da Semana</label>
                <input type="text" id="horario-dia" required>
                <label>Horário</label>
                <input type="text" id="horario-hora" required>
                <label>Local</label>
                <input type="text" id="horario-local" required>
                <button type="submit" class="btn-salvar">Salvar Horário</button>
            </form>
        </div>

        <!-- FORM: ANIVERSARIANTES -->
        <div id="aba-aniversarios" class="card">
            <h2>Cadastrar Aniversariante</h2>
            <div id="msg-aniversariante" class="msg"></div>
            <form id="form-aniversariante">
                <label>Nome Completo</label>
                <input type="text" id="aniv-nome" required>
                <label>Dia (ex: 15)</label>
                <input type="text" id="aniv-dia" required>
                <label>Mês (ex: Julho)</label>
                <input type="text" id="aniv-mes" required>
                <button type="submit" class="btn-salvar">Salvar Aniversariante</button>
            </form>
        </div>

        <!-- ABA: PASCOM (UPLOAD) -->
        <div id="aba-pascom" class="card">
            <h2>Enviar Fotos da Pascom</h2>
            <div id="msg-pascom" class="msg"></div>
            
            <p style="font-size: 0.9em; color: #666; margin-bottom: 15px;">
                Selecione a foto do seu celular ou computador. O sistema cuidará de dar um nome e salvar automaticamente.
            </p>

            <form id="form-upload-pascom">
                <label>Selecione a Imagem (JPG)</label>
                <div class="upload-area">
                    <input type="file" id="arquivo-foto" accept="image/*" required>
                </div>

                <button type="submit" class="btn-salvar" style="width: 100%;">Enviar Foto</button>
            </form>
        </div>
    </div>

    <script>
        const URL_API = 'https://api-paroquia.paroquiasjoaoboscons.workers.dev';
        let senhaSalva = '';

        async function fazerLogin() {
            const senhaInput = document.getElementById('senha').value;
            const msg = document.getElementById('msg-login');
            if (!senhaInput) { msg.innerText = "Digite a senha."; return; }

            try {
                const auth = btoa('secretaria:' + senhaInput);
                const testeResp = await fetch(`${URL_API}/admin/secretaria/avisos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + auth },
                    body: JSON.stringify({})
                });

                if (testeResp.status === 401) throw new Error("Senha incorreta");
                
                senhaSalva = senhaInput;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('conteudo-screen').style.display = 'block';

            } catch (erro) {
                msg.innerText = erro.message || "Erro ao conectar";
            }
        }

        function fazerLogout() {
            senhaSalva = '';
            document.getElementById('senha').value = '';
            document.getElementById('conteudo-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
        }

        function mudarAba(nomeAba, btnClicado) {
            document.querySelectorAll('.card').forEach(aba => aba.classList.remove('ativa'));
            document.querySelectorAll('.aba-btn').forEach(btn => btn.classList.remove('ativa'));
            document.getElementById('aba-' + nomeAba).classList.add('ativa');
            btnClicado.classList.add('ativa');
        }

        async function enviarFormulario(url, dados, divMsg) {
            const msg = document.getElementById(divMsg);
            msg.style.display = 'none';
            try {
                const auth = btoa('secretaria:' + senhaSalva);
                const resp = await fetch(`${URL_API}${url}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + auth },
                    body: JSON.stringify(dados)
                });
                if (!resp.ok) throw new Error();
                msg.className = 'msg sucesso'; msg.innerText = 'Salvo com sucesso!'; msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
                return true;
            } catch (e) {
                msg.className = 'msg erro'; msg.innerText = 'Erro ao salvar. Verifique a conexão.'; msg.style.display = 'block';
                return false;
            }
        }

        document.getElementById('form-aviso').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ok = await enviarFormulario('/admin/secretaria/avisos', {
                titulo: document.getElementById('aviso-titulo').value,
                data: document.getElementById('aviso-data').value,
                texto: document.getElementById('aviso-texto').value
            }, 'msg-aviso');
            if(ok) document.getElementById('form-aviso').reset();
        });

        document.getElementById('form-horario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ok = await enviarFormulario('/admin/secretaria/horarios', {
                tipo: document.getElementById('horario-tipo').value,
                dia: document.getElementById('horario-dia').value,
                horario: document.getElementById('horario-hora').value,
                local: document.getElementById('horario-local').value
            }, 'msg-horario');
            if(ok) document.getElementById('form-horario').reset();
        });

        document.getElementById('form-aniversariante').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ok = await enviarFormulario('/admin/secretaria/aniversariantes', {
                nome: document.getElementById('aniv-nome').value,
                dia: document.getElementById('aniv-dia').value,
                mes: document.getElementById('aniv-mes').value
            }, 'msg-aniversariante');
            if(ok) document.getElementById('form-aniversariante').reset();
        });

        // Upload da Pascom
        document.getElementById('form-upload-pascom').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg-pascom');
            const fileInput = document.getElementById('arquivo-foto');
            const file = fileInput.files[0];

            if (!file) { msg.className = 'msg erro'; msg.innerText = 'Selecione uma imagem.'; msg.style.display = 'block'; return; }

            msg.className = 'msg'; msg.style.display = 'none';
            const btn = e.target.querySelector('button');
            btn.disabled = true; btn.innerText = 'Enviando...';

            const formData = new FormData();
            formData.append('foto', file);

            try {
                const auth = btoa('secretaria:' + senhaSalva);
                const resp = await fetch(`${URL_API}/admin/pascom/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Basic ' + auth },
                    body: formData
                });

                if (!resp.ok) throw new Error();
                msg.className = 'msg sucesso'; msg.innerText = 'Foto enviada com sucesso!'; msg.style.display = 'block';
                fileInput.value = '';
            } catch (err) {
                msg.className = 'msg erro'; msg.innerText = 'Erro ao enviar. Tente novamente.'; msg.style.display = 'block';
            } finally {
                btn.disabled = false; btn.innerText = 'Enviar Foto';
            }
        });
    </script>
</body>
</html>
