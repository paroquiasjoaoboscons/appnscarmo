<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade Nossa Senhora do Carmo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { color: #5a3e7a; text-align: center; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .titulo { color: #8a2be2; margin-bottom: 5px; }
        .info { font-weight: bold; color: #666; font-size: 0.9em; }
        .leitura { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <h1>Comunidade Nossa Senhora do Carmo</h1>

    <div class="card">
        <h2>Liturgia Diária</h2>
        <div id="liturgia-conteudo">
            <p>Carregando a liturgia de hoje...</p>
        </div>
    </div>

    <script>

      <script>
    async function carregarLiturgia() {
        const container = document.getElementById('liturgia-conteudo');
        container.innerHTML = '<p>Carregando a liturgia de hoje...</p>';

        // Lista de APIs para tentar (em ordem de preferência)
        const apis = [
            {
                nome: 'Ora et Labora',
                url: 'https://liturgia.cloudhub.ia.br',
                parser: function(dados) {
                    // Formato esperado: { liturgia: { ... } } ou dados diretos
                    const l = dados.liturgia || dados;
                    let html = '';
                    if (l.data) html += `<p class="info">Data: ${l.data}</p>`;
                    if (l.cor) html += `<p class="info">Cor Litúrgica: ${l.cor}</p>`;
                    
                    if (l.primeiraLeitura) {
                        html += `<div class="leitura"><p class="titulo">${l.primeiraLeitura.titulo || 'Primeira Leitura'}</p><p style="font-size: 0.9em; white-space: pre-line;">${l.primeiraLeitura.texto || l.primeiraLeitura}</p></div>`;
                    }
                    if (l.salmo) {
                        html += `<div class="leitura"><p class="titulo">Salmo Responsorial</p><p style="font-size: 0.9em; white-space: pre-line;">${l.salmo.refrao || ''} ${l.salmo.texto || l.salmo}</p></div>`;
                    }
                    if (l.evangelho) {
                        html += `<div class="leitura"><p class="titulo">${l.evangelho.titulo || 'Evangelho'}</p><p style="font-size: 0.9em; white-space: pre-line;">${l.evangelho.texto || l.evangelho}</p></div>`;
                    }
                    return html;
                }
            },
            {
                nome: 'Liturgia CloudHub (CNBB)',
                url: 'https://liturgia.cloudhub.ia.br/v1/liturgia',
                parser: function(dados) {
                    let html = '';
                    if (dados.data) html += `<p class="info">Data: ${dados.data}</p>`;
                    if (dados.cor) html += `<p class="info">Cor Litúrgica: ${dados.cor}</p>`;
                    
                    if (dados.leituras && dados.leituras.length > 0) {
                        dados.leituras.forEach(function(leitura) {
                            html += `<div class="leitura"><p class="titulo">${leitura.titulo || 'Leitura'}</p><p style="font-size: 0.9em; white-space: pre-line;">${leitura.texto || ''}</p></div>`;
                        });
                    }
                    return html;
                }
            }
        ];

        let sucesso = false;
        let mensagemErro = '';

        for (let i = 0; i < apis.length; i++) {
            try {
                const api = apis[i];
                const resposta = await fetch(api.url, { 
                    mode: 'cors',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (!resposta.ok) {
                    throw new Error('HTTP ' + resposta.status);
                }
                
                const dados = await resposta.json();
                const html = api.parser(dados);
                
                if (html && html.trim().length > 0) {
                    container.innerHTML = html;
                    sucesso = true;
                    break; // Para no primeiro que funcionar
                } else {
                    throw new Error('Dados vazios ou formato inesperado');
                }
                
            } catch (erro) {
                mensagemErro = erro.message;
                // Continua para a próxima API
            }
        }

        if (!sucesso) {
            container.innerHTML = '<p style="color: orange;">Não foi possível carregar a liturgia agora.<br><small>Tente novamente mais tarde.</small></p>';
            console.log('Erro final:', mensagemErro);
        }
    }
    
    carregarLiturgia();
</script>
</body>
</html>
