<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade Nossa Senhora do Carmo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { color: #5a3e7a; text-align: center; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .titulo { color: #8a2be2; margin-bottom: 5px; font-weight: bold; }
        .info { font-weight: bold; color: #666; font-size: 0.9em; }
        .leitura { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <h1>Comunidade Nossa Senhora do Carmo</h1>

    <div class="card">
        <h2>Liturgia Diária</h2>
        <div id="liturgia-conteudo">
            <p>Carregando a liturgia de hoje...</p>
        </div>
    </div>

    <!-- O SCRIPT COMEÇA AQUI -->
    <script>
        async function carregarLiturgia() {
            const container = document.getElementById('liturgia-conteudo');
            
            try {
                // Tenta buscar a liturgia da API do Ora et Labora
                const resposta = await fetch('https://liturgia.cloudhub.ia.br');
                
                if (!resposta.ok) {
                    throw new Error('A API retornou um erro.');
                }
                
                const dados = await resposta.json();
                
                // Se a API retornar vazio, avisa
                if (!dados || Object.keys(dados).length === 0) {
                    throw new Error('A API retornou dados vazios.');
                }

                // Monta a tela
                let html = '';
                
                if (dados.data) html += `<p class="info">Data: ${dados.data}</p>`;
                if (dados.cor) html += `<p class="info">Cor Litúrgica: ${dados.cor}</p>`;
                
                // Tenta ler a Primeira Leitura (pode vir em formatos diferentes dependendo da API)
                if (dados.primeiraLeitura) {
                    let leitura = dados.primeiraLeitura;
                    let texto = leitura.texto || leitura;
                    let titulo = leitura.titulo || 'Primeira Leitura';
                    html += `<div class="leitura"><p class="titulo">${titulo}</p><p style="font-size: 0.9em; white-space: pre-line;">${texto}</p></div>`;
                }
                
                // Tenta ler o Salmo
                if (dados.salmo) {
                    let salmo = dados.salmo;
                    let texto = salmo.texto || salmo;
                    let refrao = salmo.refrao || '';
                    html += `<div class="leitura"><p class="titulo">Salmo Responsorial</p><p style="font-size: 0.9em; white-space: pre-line;"><strong>${refrao}</strong><br><br>${texto}</p></div>`;
                }
                
                // Tenta ler o Evangelho
                if (dados.evangelho) {
                    let evangelho = dados.evangelho;
                    let texto = evangelho.texto || evangelho;
                    let titulo = evangelho.titulo || 'Evangelho';
                    html += `<div class="leitura"><p class="titulo">${titulo}</p><p style="font-size: 0.9em; white-space: pre-line;">${texto}</p></div>`;
                }

                // Se conseguiu montar algo, mostra na tela
                if (html !== '') {
                    container.innerHTML = html;
                } else {
                    throw new Error('Não encontrei os dados da liturgia no formato esperado.');
                }

            } catch (erro) {
                // Se der qualquer erro, mostra a mensagem bonitinha
                container.innerHTML = `
                    <p style="color: #d9534f; font-weight: bold;">Não foi possível carregar a liturgia agora.</p>
                    <p style="font-size: 0.8em; color: #777;">Motivo técnico: ${erro.message}</p>
                    <p style="font-size: 0.8em; color: #777;">Isso pode ser instabilidade no servidor da liturgia ou bloqueio de segurança do GitHub.</p>
                `;
            }
        }

        // Assim que a página abrir, chama a função
        carregarLiturgia();
    </script>
    <!-- O SCRIPT TERMINA AQUI -->

</body>
</html>
