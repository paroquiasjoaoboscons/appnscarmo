<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade Nossa Senhora do Carmo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { color: #5a3e7a; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
        .titulo { color: #8a2be2; margin-bottom: 5px; font-weight: bold; }
        .info { font-weight: bold; color: #666; font-size: 0.9em; }
        .leitura { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <h1>Comunidade Nossa Senhora do Carmo</h1>

    <div class="card">
        <h2>Liturgia Diária</h2>
        <div id="liturgia-conteudo">
            <p>Carregando a liturgia de hoje...</p>
        </div>
    </div>

    <script>
        async function carregarLiturgia() {
            const container = document.getElementById('liturgia-conteudo');
            
            try {
                // API pública da Canção Nova (geralmente muito estável)
                const resposta = await fetch('https://liturgia.cancaonova.com/api/liturgia');
                
                if (!resposta.ok) {
                    throw new Error('A API retornou status ' + resposta.status);
                }
                
                const dados = await resposta.json();

                let html = '';
                
                // Mostra a data e a cor se existirem
                if (dados.data) html += `<p class="info">Data: ${dados.data}</p>`;
                if (dados.cor) html += `<p class="info">Cor Litúrgica: ${dados.cor}</p>`;

                // A Canção Nova retorna um objeto com as leituras
                if (dados.leituras) {
                    // Primeira Leitura
                    if (dados.leituras.primeiraLeitura) {
                        const p = dados.leituras.primeiraLeitura;
                        html += `<div class="leitura"><p class="titulo">${p.titulo || 'Primeira Leitura'}</p><p style="font-size: 0.9em; white-space: pre-line;">${p.texto}</p></div>`;
                    }
                    // Salmo
                    if (dados.leituras.salmo) {
                        const s = dados.leituras.salmo;
                        html += `<div class="leitura"><p class="titulo">Salmo Responsorial</p><p style="font-size: 0.9em; white-space: pre-line;">${s.texto}</p></div>`;
                    }
                    // Evangelho
                    if (dados.leituras.evangelho) {
                        const e = dados.leituras.evangelho;
                        html += `<div class="leitura"><p class="titulo">${e.titulo || 'Evangelho'}</p><p style="font-size: 0.9em; white-space: pre-line;">${e.texto}</p></div>`;
                    }
                } else {
                    html += '<p style="color: orange;">A liturgia foi carregada, mas o formato não foi reconhecido.</p>';
                }

                container.innerHTML = html;

            } catch (erro) {
                container.innerHTML = `
                    <p style="color: #d9534f; font-weight: bold;">Não foi possível carregar a liturgia agora.</p>
                    <p style="font-size: 0.8em; color: #777;">Detalhe: ${erro.message}</p>
                `;
            }
        }

        carregarLiturgia();
    </script>
</body>
</html>
