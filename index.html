<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade Nossa Senhora do Carmo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { color: #5a3e7a; text-align: center; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .titulo { color: #8a2be2; margin-bottom: 5px; }
        .info { font-weight: bold; color: #666; font-size: 0.9em; }
        .leitura { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <h1>Comunidade Nossa Senhora do Carmo</h1>

    <div class="card">
        <h2>Liturgia Diária</h2>
        <div id="liturgia-conteudo">
            <p>Carregando a liturgia de hoje...</p>
        </div>
    </div>

    <script>

      <script>
    async function carregarLiturgia() {
        const container = document.getElementById('liturgia-conteudo');
        try {
            // API v1: mais simples e estável
            const resposta = await fetch('https://liturgia.up.railway.app/');
            if (!resposta.ok) throw new Error('Erro ' + resposta.status);
            
            const dados = await resposta.json();

            // Monta o HTML com os campos da v1
            let html = '';
            
            if (dados.data) html += `<p class="info">Data: ${dados.data}</p>`;
            if (dados.liturgia) html += `<p class="info">${dados.liturgia}</p>`;
            if (dados.cor) html += `<p class="info">Cor Litúrgica: ${dados.cor}</p>`;

            // Primeira Leitura
            if (dados.primeiraLeitura && dados.primeiraLeitura.texto) {
                html += `
                    <div class="leitura">
                        <p class="titulo">${dados.primeiraLeitura.titulo || 'Primeira Leitura'}</p>
                        <p style="font-size: 0.9em; white-space: pre-line;">${dados.primeiraLeitura.texto}</p>
                    </div>
                `;
            }

            // Salmo
            if (dados.salmo && dados.salmo.texto) {
                html += `
                    <div class="leitura">
                        <p class="titulo">Salmo Responsorial</p>
                        <p style="font-size: 0.9em; white-space: pre-line;">${dados.salmo.refrao || ''}</p>
                        <p style="font-size: 0.9em; white-space: pre-line;">${dados.salmo.texto}</p>
                    </div>
                `;
            }

            // Evangelho
            if (dados.evangelho && dados.evangelho.texto) {
                html += `
                    <div class="leitura">
                        <p class="titulo">${dados.evangelho.titulo || 'Evangelho'}</p>
                        <p style="font-size: 0.9em; white-space: pre-line;">${dados.evangelho.texto}</p>
                    </div>
                `;
            }

            if (!html) {
                html = '<p>Não foi possível montar a liturgia. A API retornou dados vazios.</p>';
            }

            container.innerHTML = html;

        } catch (erro) {
            container.innerHTML = '<p style="color: red;">Erro: ' + erro.message + '</p>';
        }
    }
    carregarLiturgia();
</script>  
</body>
</html>
